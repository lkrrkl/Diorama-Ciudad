<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Constructor de Dioramas - Ciudad Nocturna</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:dark;--bg:#0b0c26;--pn:#14153a;--ln:#2c2f6b;--tx:#e8eaff;--mu:#9aa0d8;--pk:#ff4bd8;--cy:#00f0ff;box-sizing:border-box}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:linear-gradient(180deg,#0b0c26,#1a1048 60%,#3a1050);color:var(--tx);font:14px/1.35 "Trebuchet MS",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:6px 12px;flex:none}
h1{font-size:18px;margin:0;color:var(--cy);text-shadow:0 0 10px var(--cy)}
h3{margin:6px 0 4px;font-size:11px;color:var(--pk);text-transform:uppercase;letter-spacing:.08em}
button,input,select{font:inherit;color:var(--tx);background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:6px 10px}
button{cursor:pointer}button:hover{border-color:var(--cy)}
button.on{border-color:var(--pk);box-shadow:0 0 8px var(--pk);background:#2a1450}
main{flex:1;display:grid;grid-template-columns:1fr;gap:8px;padding:0 10px 10px;min-height:0}
main[hidden]{display:none}
aside{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;overflow:hidden}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px;flex:none}
.viewer{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
canvas{width:100%;height:100%;border-radius:12px;border:1px solid var(--ln);display:block;touch-action:none;cursor:crosshair;flex:1}
.strip{display:flex;flex-wrap:wrap;gap:8px}
.card{width:110px;background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:4px;font-size:11px;cursor:pointer}
.card.on{border-color:var(--pk);box-shadow:0 0 8px var(--pk)}
.card img{width:100%;border-radius:6px;display:block}
.card b{display:block;margin:2px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#slots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:420px;margin-bottom:8px}
.slot{position:relative;min-height:54px;border:1px dashed var(--ln);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--mu);font-size:12px;cursor:pointer;background:var(--pn)}
.slot img{width:100%;border-radius:6px;display:block}
.slot i{position:absolute;top:2px;right:4px;font-style:normal;background:#000a;border-radius:50%;width:18px;height:18px;text-align:center;line-height:18px}
.panel{position:absolute;background:rgba(20,21,58,.96);border:1px solid var(--ln);border-radius:10px;z-index:10;box-shadow:0 8px 28px #000c;backdrop-filter:blur(6px)}
.panel-top{top:6px;left:6px;right:54px;display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:6px 8px;font-size:11px;max-height:44%;overflow:auto}
.panel-top[hidden]{display:none}
.panel-top label{color:var(--mu);font-size:9px;text-transform:uppercase;letter-spacing:.05em}
.panel-top input[type=text]{flex:1 1 70px;min-width:50px;padding:3px 5px}
.panel-top input[type=number]{width:44px;padding:3px 5px}
.panel-top select{padding:2px 5px;font-size:11px}
.panel-top input[type=color]{width:30px;height:26px;padding:1px;cursor:pointer}
.panel-top .hctl{display:flex;gap:2px}
.panel-top .hctl button{padding:2px 6px;font-size:12px}
.panel-top .col{display:flex;flex-direction:column;gap:1px;align-items:center}
.panel-right{top:6px;right:6px;display:flex;flex-direction:column;gap:3px;padding:4px;align-items:center}
.panel-right button{width:38px;height:38px;padding:0;font-size:16px;display:flex;align-items:center;justify-content:center;line-height:1}
.panel-right hr{border:0;border-top:1px solid var(--ln);width:100%;margin:1px 0}
#placingInfo{display:none;font-size:9px;line-height:1.15;padding:4px 4px;text-align:center;color:var(--tx);border-bottom:1px solid var(--ln);margin-bottom:2px;min-width:64px;max-width:92px;word-break:break-word;background:rgba(0,240,255,.10);border-radius:6px;box-shadow:0 0 8px rgba(0,240,255,.25)}
.fx-strip{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);display:flex;gap:4px;background:rgba(20,21,58,.88);padding:4px 8px;border-radius:999px;border:1px solid var(--ln);z-index:9;backdrop-filter:blur(4px);flex-wrap:wrap;justify-content:center;max-width:90%}
.fxb{width:32px;height:32px;padding:0;font-size:15px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--pn);border:1px solid var(--ln)}
.fxb.on{background:#1a3a5a;border-color:var(--cy);box-shadow:0 0 8px var(--cy)}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:200}
.modal[hidden]{display:none}
.modal-body{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:16px;max-width:640px;width:92%;max-height:82vh;overflow:auto}
.modal-body h2{color:var(--cy);font-size:16px;margin:0 0 12px}
#fsBtn{font-size:16px;padding:4px 10px;background:var(--pn);border:1px solid var(--ln);border-radius:8px;cursor:pointer;line-height:1}
#saveToast{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-20px);background:rgba(20,21,58,.96);border:2px solid var(--cy);color:var(--cy);padding:14px 24px;border-radius:12px;font-size:14px;font-weight:bold;z-index:500;opacity:0;pointer-events:none;transition:opacity .35s ease, transform .35s ease;box-shadow:0 0 32px rgba(0,240,255,.55);text-align:center;max-width:90vw}
#saveToast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Selector flotante */
.picker-btn{position:fixed;right:18px;bottom:80px;width:60px;height:60px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#2a1450,#14153a);border:2px solid var(--cy);color:var(--cy);font-size:26px;
  box-shadow:0 0 22px rgba(0,240,255,.55),0 4px 12px #000a;z-index:120;display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:transform .15s ease, box-shadow .2s ease;touch-action:manipulation}
.picker-btn:active{transform:scale(.92)}
.picker-btn.open{border-color:var(--pk);box-shadow:0 0 22px rgba(255,75,216,.55);color:var(--pk)}
.picker{position:fixed;left:0;right:0;bottom:0;max-height:72vh;background:rgba(20,21,58,.98);border:1px solid var(--ln);
  border-radius:16px 16px 0 0;z-index:150;display:flex;flex-direction:column;backdrop-filter:blur(10px);
  box-shadow:0 -10px 40px #000c;transform:translateY(100%);opacity:0;pointer-events:none;
  transition:transform .28s ease,opacity .28s ease}
.picker.show{transform:translateY(0);opacity:1;pointer-events:auto}
.picker-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--ln);flex:none}
.picker-head .picker-title{flex:1;font-weight:bold;color:var(--cy);font-size:14px;text-align:center}
.picker-head button{width:34px;height:34px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:16px}
.picker-head button[hidden]{display:none}
.picker-body{overflow:auto;padding:10px;flex:1;-webkit-overflow-scrolling:touch}
.picker-cats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:520px){.picker-cats{grid-template-columns:repeat(3,1fr)}}
.picker-cat{display:flex;align-items:center;gap:10px;padding:12px;background:var(--pn);border:1px solid var(--ln);
  border-radius:10px;cursor:pointer;text-align:left;color:var(--tx);font-size:12px;transition:border-color .15s,background .15s}
.picker-cat:hover{border-color:var(--cy);background:#1a1b48}
.picker-cat .picker-cat-icon{font-size:22px;line-height:1}
.picker-cat b{display:block;font-size:12px}
.picker-cat small{display:block;color:var(--mu);font-size:10px}
.picker-items{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:520px){.picker-items{grid-template-columns:repeat(3,1fr)}}
@media(min-width:820px){.picker-items{grid-template-columns:repeat(4,1fr)}}
.picker-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px;background:var(--pn);
  border:1px solid var(--ln);border-radius:10px;cursor:pointer;color:var(--tx);font-size:10px;text-align:center;
  transition:border-color .15s,box-shadow .15s;min-width:0;overflow:hidden}
.picker-item:hover{border-color:var(--cy)}
.picker-item.on{border-color:var(--pk);box-shadow:0 0 10px var(--pk)}
.picker-item img{width:100%;aspect-ratio:1/1;object-fit:contain;border-radius:6px;background:#0a0b20;display:block}
.picker-item b{font-weight:normal;font-size:10px;line-height:1.15;overflow:hidden;text-overflow:ellipsis;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;width:100%}
@media(min-width:820px){
  .picker{left:18px;right:auto;bottom:18px;width:560px;max-height:76vh;border-radius:16px;transform:translateY(20px)}
  .picker.show{transform:translateY(0)}
  .picker-btn{left:18px;right:auto;bottom:18px}
}
@media(max-width:820px){
  header{padding:4px 8px;gap:6px}
  h1{font-size:13px}
  main{padding:0 6px 6px}
  .bar{gap:4px}
  .bar input#nm{flex:1 1 100%}
  .bar button{flex:1 1 auto;padding:8px 8px;font-size:12px;min-width:44px}
  .panel-right button{width:44px;height:44px;font-size:18px}
  .fxb{width:38px;height:38px;font-size:17px}
  .panel-top{top:4px;left:4px;right:56px;padding:5px 6px;font-size:10px;gap:4px;max-height:40%}
  .panel-top input[type=number]{width:38px}
  #slots{grid-template-columns:repeat(3,1fr);max-width:none}
  .picker-btn{bottom:88px}
  .fx-strip{bottom:4px;padding:3px 6px;gap:3px}
  .panel-right{top:4px;right:4px;gap:4px}
}
</style></head><body>
<header>
<h1>🌃 Constructor de Dioramas</h1>
<nav style="display:flex;gap:6px;align-items:center">
<button id="t1" class="on">Construir</button>
<button id="t2">Unir</button>
<button id="fsBtn" title="Pantalla completa">⛶</button>
</nav>
</header>

<main id="v1">
<section style="display:flex;flex-direction:column;min-height:0">
<div class="bar">
<input id="nm" placeholder="Nombre del diorama" maxlength="30">
<button id="bsave">💾 Guardar</button>
<button id="bload">📂 Cargar</button>
<button id="bnew">＋ Nuevo</button>
<button id="bdl1">⬇ PNG</button>
</div>
<div class="viewer">
  <canvas id="cv"></canvas>
  <div id="selbar" class="panel panel-top" hidden>
    <div class="col"><label>Rótulo</label><input type="text" id="selnm" maxlength="24" placeholder="Texto"></div>
    <div class="col"><label>Color rótulo</label><input type="color" id="selcol" value="#ff4bd8"></div>
    <div class="col"><label>Color pared</label><input type="color" id="selwall" value="#5a5a7a"></div>
    <div class="col"><label>Color techo</label><input type="color" id="selroof" value="#2a3a5a"></div>
    <div class="col"><label>Color LED</label><input type="color" id="selLED" value="#00f0ff"></div>
    <div class="col"><label>Luces techo</label><input type="number" id="selRL" min="0" max="24" value="0"></div>
    <div class="col"><label>Color luces</label><input type="color" id="selRLc" value="#ffd23f"></div>
    <div class="col"><label>Modo</label><select id="selmode"><option value="fixed">Fijo</option><option value="digital">Digital</option></select></div>
    <div class="col"><label>Color calzada</label><input type="color" id="selroadc" value="#2a2a3a"></div>
    <div class="col"><label>Altura</label><span class="hctl"><button id="selhp">▲</button><button id="selhm">▼</button></span></div>
    <div class="col"><label>Acción</label><button id="seldel">🗑</button></div>
  </div>
  <div class="panel panel-right" id="tools">
    <div id="placingInfo"></div>
    <button id="tbrot" title="Rotar">⟳</button><hr>
    <button id="tbhp" title="Subir altura">▲</button>
    <button id="tbhm" title="Bajar altura">▼</button><hr>
    <button id="tbq+" title="Aumentar cuadrantes">➕</button>
    <button id="tbq-" title="Disminuir cuadrantes">➖</button><hr>
    <button id="tber" title="Borrar">🧽</button>
    <button id="tbclr" title="Limpiar">🗑️</button>
  </div>
  <div class="fx-strip">
    <button class="fxb" data-fx="navidad" title="Navidad">🎄</button>
    <button class="fxb" data-fx="fuegos" title="Fuegos">🎆</button>
    <button class="fxb" data-fx="lluvia" title="Lluvia">🌧</button>
    <button class="fxb" data-fx="nieve" title="Nieve">❄</button>
    <button class="fxb" data-fx="pajaros" title="Pájaros">🐦</button>
    <button class="fxb" data-fx="confeti" title="Confeti">🎉</button>
    <button class="fxb" data-fx="estrobo" title="Estrobo">💡</button>
    <button class="fxb" id="tbGrid" title="Cuadrícula">▦</button>
  </div>
</div>
</section></main>

<main id="v2" hidden>
<aside><h3>1 · Elige un diorama</h3><div id="lib2" style="overflow:auto;flex:1"></div></aside>
<section style="display:flex;flex-direction:column;min-height:0">
<h3>2 · Toca una casilla para colocarlo (máx. 9)</h3>
<div id="slots"></div>
<div class="bar"><button id="bdl2">⬇ Descargar PNG</button></div>
<canvas id="cv2" style="flex:1"></canvas>
</section></main>

<button id="pickerBtn" class="picker-btn" title="Añadir edificación">🏗️</button>
<div id="picker" class="picker">
  <div class="picker-head">
    <button id="pickerBack" hidden>←</button>
    <span id="pickerTitle" class="picker-title">Categorías</span>
    <button id="pickerClose">✕</button>
  </div>
  <div id="pickerBody" class="picker-body"></div>
</div>

<div id="loadmodal" class="modal" hidden>
<div class="modal-body">
<h2>📂 Cargar diorama guardado</h2>
<div id="loadlist" class="strip"></div>
<div style="margin-top:12px;text-align:right"><button id="loadclose">Cerrar</button></div>
</div>
</div>

<div id="saveToast">✅ ¡Guardado! Listo para unir en "Unir"</div>

function getMaterial(it, T){
  if(it && it.wallMaterial) return it.wallMaterial;
  const n = (T.n||'').toLowerCase();
  if(n.includes('contempor') || n.includes('modern')) return 'glass';
  if(n.includes('típica')||n.includes('lujo')||n.includes('tica')) return 'painted';
  if(T.cat==='industrial') return 'metal';
  if(T.cat==='emblematico'){
    if(n.includes('torre')||n.includes('led')||n.includes('oficina')||
       n.includes('tower')||n.includes('alpha')||n.includes('beta')||n.includes('gamma')) return 'glass';
  }
  if(T.cat==='institucional') return 'concrete';
  if(T.cat==='comercio'){
    if(n.includes('kiosk')||n.includes('kiosko')||n.includes('puesto')) return 'painted';
    if(n.includes('super')||n.includes('mega')||n.includes('cine')||n.includes('multiplex')) return 'concrete';

  if(T.cat==='transporte')return 'concrete';
  if(T.cat==='deporte')   return 'concrete';

}

function setup(c,S,v,zoom=1,panX=0,panY=0){

  const TW=W*.92/S*zoom, TH=TW/2, HZ=TW*.5;
  const cx=W/2+panX;
  const baseFrac=S>12?0.55:0.60;
  const cy=H*baseFrac+panY-S*TH/2;
  G={c,S,view:v,W,H,TW,TH,HZ,cx,cy,sc:TW/69};
}
function resizeCanvas(c){ const r=c.getBoundingClientRect(); c.width=Math.max(100,Math.round(r.width)); c.height=Math.max(100,Math.round(r.height)); }
function rot(x,y){const S=G.S,r=G.view;return r==0?[x,y]:r==1?[S-y,x]:r==2?[S-x,S-y]:[y,S-x]}
const P=(rx,ry,z)=>[G.cx+(rx-ry)*G.TW/2,G.cy+(rx+ry)*G.TH/2-z*G.HZ];
const PW=(x,y,z=0)=>{const a=rot(x,y);return P(a[0],a[1],z)};
function poly(p,f,s,lw){const c=G.c;c.beginPath();p.forEach((q,i)=>i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]));c.closePath();if(f){c.fillStyle=f;c.fill()}if(s){c.strokeStyle=s;c.lineWidth=lw||1;c.stroke()}}
const gpoly=(x0,y0,x1,y1,f,s)=>poly([PW(x0,y0),PW(x1,y0),PW(x1,y1),PW(x0,y1)],f,s);

/* ============================================================
   GLOW — AHORA SOPORTA HEX, hsl() y rgb()
   ============================================================ */
function sglow(x,y,col,r,a,ys=.5){
  const c=G.c;
  c.save();
  c.globalCompositeOperation='lighter';
  c.translate(x,y);
  c.scale(1,ys);
  const g=c.createRadialGradient(0,0,0,0,0,r);

  // Alpha: 'aa' (hex) → 0.667 ; si ya es número, úsalo tal cual
  let alpha = 1;
  if(typeof a === 'string' && /^[0-9a-fA-F]{2}$/.test(a)) alpha = parseInt(a,16)/255;
  else if(typeof a === 'number') alpha = a;

  let col0, col1;
  if(col && col.startsWith('#')){
    // Hex: concatenar sufijo hex para stop0, '00' para stop1
    col0 = col + a;
    col1 = col + '00';
  } else if(typeof col === 'string' && /^\s*hsl/i.test(col)){
    // hsl(...) → hsla(..., alpha)
    const base = col.trim().replace(/^hsl/i, 'hsla');
    col0 = base.replace(/\)\s*$/, `, ${alpha})`);
    col1 = base.replace(/\)\s*$/, `, 0)`);
  } else if(typeof col === 'string' && /^\s*rgb/i.test(col)){
    // rgb(...) → rgba(..., alpha)   |   rgba(...) → forzar alpha
    const base = col.trim().replace(/^rgb/i, 'rgba');
    if(/^rgba\s*\(/i.test(base) && base.includes(',')){
      // ya tiene alpha: reemplazar el último componente
      col0 = base.replace(/,\s*[^,]+\)\s*$/, `, ${alpha})`);
      col1 = base.replace(/,\s*[^,]+\)\s*$/, ', 0)');
    } else {
      col0 = base.replace(/\)\s*$/, `, ${alpha})`);
      col1 = base.replace(/\)\s*$/, ', 0)');
    }
  } else {
    // Fallback: asumir hex o color CSS con alpha no estandar → usa string tal cual
    col0 = col; col1 = col;
  }

  try{
    g.addColorStop(0, col0);
    g.addColorStop(1, col1);
  }catch(err){
    // Ante cualquier color inválido, pintar transparente y no abortar
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
  }

  c.fillStyle = g;
  c.beginPath();
  c.arc(0,0,r,0,7);
  c.fill();
  c.restore();
}

function box(x0,y0,x1,y1,z0,z1,cl,cr,ct,st){
  const a=rot(x0,y0),b=rot(x1,y1),B={rx0:Math.min(a[0],b[0]),rx1:Math.max(a[0],b[0]),ry0:Math.min(a[1],b[1]),ry1:Math.max(a[1],b[1])};
  poly([P(B.rx0,B.ry1,z0),P(B.rx1,B.ry1,z0),P(B.rx1,B.ry1,z1),P(B.rx0,B.ry1,z1)],cl);
  poly([P(B.rx1,B.ry0,z0),P(B.rx1,B.ry1,z0),P(B.rx1,B.ry1,z1),P(B.rx1,B.ry0,z1)],cr);
  poly([P(B.rx0,B.ry0,z1),P(B.rx1,B.ry0,z1),P(B.rx1,B.ry1,z1),P(B.rx0,B.ry1,z1)],ct,st,2);
  return B;
}

  } else if(material === 'metal'){

      const awW = LK*.92/6;
      for(let i=0;i<6;i++){ c.fillStyle = i%2 ? neon : '#ffffff'; c.globalAlpha = .75;
        c.fillRect(LK*.04 + i*awW, gy - .07*K, awW, .07*K); }
      c.globalAlpha=1; c.shadowColor=neon; c.shadowBlur=8*sc;
      c.fillStyle=neon; c.fillRect(LK*.04, gy-.01*K, LK*.92, .01*K); c.shadowBlur=0;
    }
  }

  if(material === 'painted' && T.cat==='vivienda' && nf >= 1){
    for(let r=1; r<nf; r++){
      const y = (s0 + r*.42)*K + ww + 1;
      for(let q=0; q<nc; q+=2){
        const x = (q+.5)*LK/nc - ww/2;
        c.fillStyle='rgba(200,200,220,0.55)'; c.fillRect(x-2, y, ww+4, 1.5);
        c.fillStyle='rgba(180,180,200,0.4)';
        c.fillRect(x-2, y-4, .8, 4); c.fillRect(x+ww+1.2, y-4, .8, 4); c.fillRect(x-2, y-4, ww+4, .8);
      }
    }
  }

  if(T.shape=='scr' && isFront && _th>1 && lit){
    const rw=Math.floor((_th-s0-.2)/.15), cn=10, pw=LK*.76/cn;
    for(let r=0;r<rw;r++)for(let q=0;q<cn;q++){
      c.fillStyle='hsl('+((TICK*22+r*9+q*17)%360)+',90%,'+(42+((TICK+r+q)%5)*6)+'%)';
      c.fillRect(LK*.12+q*pw, (s0+r*.15)*K, pw-2, .11*K);
    }
  }

  if(isFront && label){
    const sy=.06*K,sh=.26*K,sw=LK*.88,sx=(LK-sw)/2;
    let signCol=neon, glowBlur=9*sc;
    if(!lit){ signCol='#2a2a45'; glowBlur=0; }
    else if(it.signMode==='digital' || (T.shape==='scr'&&it.signMode!=='fixed')){
      const hue=((animT*40)+(label.length*37)+(f*60))%360;
      signCol=`hsl(${hue},90%,62%)`;
      glowBlur=(10+6*Math.sin(animT*3))*sc;
    }
    c.fillStyle='#0d0e26';c.fillRect(sx,sy,sw,sh);
    if(lit){ c.shadowColor=signCol;c.shadowBlur=glowBlur; }
    c.strokeStyle=signCol;c.lineWidth=2;c.strokeRect(sx,sy,sw,sh);
    let fs=13;c.font='bold '+fs+'px "Trebuchet MS",sans-serif';
    const tw=c.measureText(label).width;
    if(tw>sw-8){fs=fs*(sw-8)/tw;c.font='bold '+fs+'px "Trebuchet MS",sans-serif'}
    c.fillStyle=signCol;c.textAlign='center';c.textBaseline='middle';
    c.fillText(label,LK/2,sy+sh/2+1);c.shadowBlur=0;
  }
  c.restore();
}

function lamp(x,y){const c=G.c,b=PW(x,y),t=PW(x,y,.6),s=G.sc;
  c.strokeStyle='#0a0a1c';c.lineWidth=2.5*s;c.beginPath();c.moveTo(b[0],b[1]);c.lineTo(t[0],t[1]);c.stroke();
  sglow(t[0],t[1],'#ffa83c',34*s,'88',1);
  sglow(b[0],b[1],'#ffa83c',G.TW*.55,'44');
  c.fillStyle='#ffe0a0';c.beginPath();c.arc(t[0],t[1],3.2*s,0,7);c.fill();
}
function tree(x,y,s){const c=G.c,b=PW(x,y),t=PW(x,y,.3*s),m=PW(x,y,.52*s),r=G.TW*.2*s;
  c.strokeStyle='#2a1a22';c.lineWidth=3*G.sc*s;c.beginPath();c.moveTo(b[0],b[1]);c.lineTo(t[0],t[1]);c.stroke();
  const g=c.createRadialGradient(m[0]-r*.3,m[1]-r*.4,r*.1,m[0],m[1],r);
  g.addColorStop(0,'#3fd08a');g.addColorStop(1,'#0f5a46');
  c.fillStyle=g;c.beginPath();c.ellipse(m[0],m[1],r,r*.85,0,0,7);c.fill();
}
function lightPost(x,y,z0,h,col){
  const c=G.c, s=G.sc, b=PW(x,y,z0), t=PW(x,y,z0+h);
  c.strokeStyle='#333'; c.lineWidth=2*s;
  c.beginPath(); c.moveTo(b[0],b[1]); c.lineTo(t[0],t[1]); c.stroke();
  const p=PW(x,y,z0+h);
  sglow(p[0],p[1],col||'#ffe080',20*s,'aa',1);
  c.fillStyle=col||'#fff8d0'; c.beginPath(); c.arc(p[0],p[1],2.2*s,0,7); c.fill();
}

/* --------- SUELO --------- */
function gnd(it,items){
  const T=TYPES[it.t],[w,d]=dims(it),x=it.x,y=it.y,k=T.kind,sh=T.shape;
  if(k=='street'){
    gpoly(x,y,x+w,y+d,'#3d3d62');
    const h=it.rot%2==0;
    if(h){
      gpoly(x,y+d*.18,x+w,y+d*.82,'#17172c');
      for(let s=.1;s<w-.1;s+=.4) gpoly(x+s,y+d*.47,x+s+.2,y+d*.53,'#ffd23f');
    } else {
      gpoly(x+w*.18,y,x+w*.82,y+d,'#17172c');
      for(let s=.1;s<d-.1;s+=.4) gpoly(x+w*.47,y+s,x+w*.53,y+s+.2,'#ffd23f');
    }
    return;
  }
  if(k=='xwalk'){
    gpoly(x,y,x+w,y+d,'#17172c');
    const sw='#5a5a7a', c=.2;
    gpoly(x,y,x+w*c,y+d*c,sw); gpoly(x+w*(1-c),y,x+w,y+d*c,sw);
    gpoly(x,y+d*(1-c),x+w*c,y+d,sw); gpoly(x+w*(1-c),y+d*(1-c),x+w,y+d,sw);
    const cw='#f0e8b0';
    for(let i=0;i<4;i++){
      const sx = x + w*(c+0.04) + i*(w*(1-2*c-0.08)/4);
      gpoly(sx, y+d*c+0.02, sx+w*0.06, y+d*(c+0.1), cw);
      gpoly(sx, y+d*(1-c-0.1), sx+w*0.06, y+d*(1-c-0.02), cw);
    }
    for(let i=0;i<4;i++){
      const sy = y + d*(c+0.04) + i*(d*(1-2*c-0.08)/4);
      gpoly(x+w*c+0.02, sy, x+w*(c+0.1), sy+d*0.06, cw);
      gpoly(x+w*(1-c-0.1), sy, x+w*(1-c-0.02), sy+d*0.06, cw);
    }
    return;
  }
  if(k=='road'){
    const base = it.roadColor || '#2a2a3a';
    gpoly(x,y,x+w,y+d,base);
    const hasWalk=(nx,ny)=>items.some(o=>{
      const ot=TYPES[o.t].kind;
      if(ot!='road'&&ot!='street')return false;
      const[ow,od]=dims(o);
      return nx>=o.x&&nx<o.x+ow&&ny>=o.y&&ny<o.y+od;
    });
    const swC='#5a5a7a';
    if(!hasWalk(x,y-1)) gpoly(x,y,x+w,y+.1,swC);
    if(!hasWalk(x,y+1)) gpoly(x,y+d-.1,x+w,y+d,swC);
    if(!hasWalk(x-1,y)) gpoly(x,y,x+.1,y+d,swC);
    if(!hasWalk(x+1,y)) gpoly(x+w-.1,y,x+w,y+d,swC);
    return;
  }
  if(k=='trainline'){
    const h=it.rot%2==0;
    gpoly(x,y,x+w,y+d,'#3a3a4a');
    if(h){
      gpoly(x,y+d*.3,x+w,y+d*.35,'#8a8a9a');
      gpoly(x,y+d*.65,x+w,y+d*.7,'#8a8a9a');
      for(let s=.05;s<w;s+=.15) gpoly(x+s,y+d*.2,x+s+.05,y+d*.8,'#2a1a10');
    } else {
      gpoly(x+w*.3,y,x+w*.35,y+d,'#8a8a9a');
      gpoly(x+w*.65,y,x+w*.7,y+d,'#8a8a9a');
      for(let s=.05;s<d;s+=.15) gpoly(x+w*.2,y+s,x+w*.8,y+s+.05,'#2a1a10');
    }
    return;
  }
  if(k=='trainx'){
    gpoly(x,y,x+w,y+d,'#3a3a4a');
    gpoly(x+w*.3,y,x+w*.35,y+d,'#8a8a9a');
    gpoly(x+w*.65,y,x+w*.7,y+d,'#8a8a9a');
    gpoly(x,y+d*.3,x+w,y+d*.35,'#8a8a9a');
    gpoly(x,y+d*.65,x+w,y+d*.7,'#8a8a9a');
    for(let s=.05;s<w;s+=.15){
      gpoly(x+s,y+d*.2,x+s+.05,y+d*.8,'#2a1a10');
      gpoly(x+w*.2,y+s,x+w*.8,y+s+.05,'#2a1a10');
    }
    return;
  }
  if(k=='sign'){ gpoly(x,y,x+w,y+d,'#2a2a3a'); return; }
  if(k=='lake'){
    gpoly(x,y,x+w,y+d,'#2a5a3a');
    gpoly(x+.1,y+.1,x+w-.1,y+d-.1,'#1a5a8a');
    gpoly(x+.3,y+.5,x+w-.3,y+.6,'#2a7aaa');
    gpoly(x+.5,y+1.1,x+w-.5,y+1.2,'#2a7aaa');
    return;
  }
  if(k=='median'){
    const h=(sh==='h')===(it.rot%2===0);
    gpoly(x,y,x+w,y+d,'#3d3d62');
    if(h){
      gpoly(x,y+d*.2,x+w,y+d*.8,'#17172c');
      gpoly(x,y+d*.45,x+w,y+d*.55,'#2a5a3a');
      for(let i=0;i<4;i++){gpoly(x+i*.5+.1,y+d*.35,x+i*.5+.3,y+d*.38,'#7dff7a');gpoly(x+i*.5+.1,y+d*.62,x+i*.5+.3,y+d*.65,'#7dff7a')}
    } else {
      gpoly(x+w*.2,y,x+w*.8,y+d,'#17172c');
      gpoly(x+w*.45,y,x+w*.55,y+d,'#2a5a3a');
      for(let i=0;i<4;i++){gpoly(x+w*.35,y+i*.5+.1,x+w*.38,y+i*.5+.3,'#7dff7a');gpoly(x+w*.62,y+i*.5+.1,x+w*.65,y+i*.5+.3,'#7dff7a')}
    }
    return;
  }
  if(k=='medianx'){
    gpoly(x,y,x+w,y+d,'#3d3d62');
    gpoly(x,y+d*.2,x+w,y+d*.8,'#17172c');
    gpoly(x+w*.2,y,x+w*.8,y+d,'#17172c');
    gpoly(x,y+d*.45,x+w*.2,y+d*.55,'#2a5a3a');
    gpoly(x+w*.8,y+d*.45,x+w,y+d*.55,'#2a5a3a');
    gpoly(x+w*.45,y,x+w*.55,y+d*.2,'#2a5a3a');
    gpoly(x+w*.45,y+d*.8,x+w*.55,y+d,'#2a5a3a');
    const cw='#f0e8b0';
    for(let i=0;i<4;i++){
      gpoly(x+w*.5+i*.3,y+d*.02,x+w*.6+i*.3,y+d*.18,cw);
      gpoly(x+w*.5+i*.3,y+d-.18,x+w*.6+i*.3,y+d-.02,cw);
      gpoly(x+.02,y+d*.5+i*.3,x+.18,y+d*.6+i*.3,cw);
      gpoly(x+w-.18,y+d*.5+i*.3,x+w-.02,y+d*.6+i*.3,cw);
    }
    return;
  }
  if(k=='green'){
    gpoly(x,y,x+w,y+d,'#1d5a3c','#2a7a4c',1);
    for(let i=0;i<Math.min(20,Math.round(5*w*d));i++){
      const px=x+.15+hs(i*3.1)*(w-.3), py=y+.15+hs(i*7.3)*(d-.3);
      gpoly(px,py,px+.05,py+.05,'#3a9a5c');
    }
    return;
  }
  if(k=='park'||k=='tree'){
    gpoly(x,y,x+w,y+d,T.wall);
    if(k=='park'){
      if(w===1 && d===1){ gpoly(x+.42,y,x+.58,y+1,'#5a4a78'); }
      else {
        gpoly(x+w/2-.08,y,x+w/2+.08,y+d,'#5a4a78');
        gpoly(x,y+d/2-.08,x+w,y+d/2+.08,'#5a4a78');
        groundCircle(x+w/2, y+d/2, Math.min(w,d)*.13, '#4a4a7a','#00f0ff');
        if(w>=3) groundCircle(x+w*.72, y+d*.28, .35, '#1a5a8a','#00f0ff');
        for(let i=0;i<w*d*2;i++){
          const fx = x + .2 + hs(i*5.1)* (w-.4);
          const fy = y + .2 + hs(i*9.7)* (d-.4);
          if(Math.abs(fx-(x+w/2))<.15 || Math.abs(fy-(y+d/2))<.15) continue;
          gpoly(fx,fy,fx+.06,fy+.06,'#ff6b4b');
        }
      }
    }
    return;
  }
  if(k=='parkx'){
    gpoly(x,y,x+w,y+d,T.wall);
    gpoly(x+w*.42,y,x+w*.58,y+d,'#5a4a78');
    gpoly(x,y+d*.42,x+w,y+d*.58,'#5a4a78');
    gpoly(x+w*.47,y+d*.47,x+w*.53,y+d*.53,'#ffd23f');
    return;
  }
  if(k=='playground'){
    gpoly(x,y,x+w,y+d,T.wall);
    gpoly(x+.15,y+.15,x+w-.15,y+d-.15,'#d8b878','#a08850',1);
    return;
  }
  if(k=='plaza'){
    gpoly(x,y,x+w,y+d,T.wall,'#6a6a5a',1);
    const nx=Math.max(2,Math.round(w)), ny=Math.max(2,Math.round(d));
    for(let i=1;i<nx;i++) gpoly(x+i*w/nx,y,x+i*w/nx+.02,y+d,'rgba(0,0,0,0.15)');
    for(let j=1;j<ny;j++) gpoly(x,y+j*d/ny,x+w,y+j*d/ny+.02,'rgba(0,0,0,0.15)');
    return;
  }
  if(k=='fountain'){ gpoly(x,y,x+w,y+d,'#33335a'); return; }
  if(sh=='bowl'||sh=='ring'){ gpoly(x,y,x+w,y+d,'#2f7a45'); return; }
  gpoly(x,y,x+w,y+d,'#33335a');
  if(T.sign){
    const f=FD[it.rot%4],p=PW(x+w/2+f[0]*(w/2+.45),y+d/2+f[1]*(d/2+.45));
    sglow(p[0],p[1],it.neon||T.neon,G.TW*.95,'44');
  }
}

/* --------- DIBUJO DE OBJETOS --------- */
const msy=a=>a.reduce((s,v)=>s+v[1],0)/a.length;
function gab(x0,y0,x1,y1,z,rh,c1,c2,ce){
  const t=(x1-x0)<(y1-y0),A=t?[y0,y1,x0,x1]:[x0,x1,y0,y1],q=(a,b,e)=>t?PW(b,a,e):PW(a,b,e),bm=(A[2]+A[3])/2,e=z+rh;
  [[[q(A[0],A[2],z),q(A[1],A[2],z),q(A[1],bm,e),q(A[0],bm,e)],c1],
   [[q(A[0],A[3],z),q(A[1],A[3],z),q(A[1],bm,e),q(A[0],bm,e)],c2],
   [[q(A[0],A[2],z),q(A[0],A[3],z),q(A[0],bm,e)],ce],
   [[q(A[1],A[2],z),q(A[1],A[3],z),q(A[1],bm,e)],ce]]
   .sort((p,r)=>msy(p[0])-msy(r[0])).forEach(p=>poly(p[0],p[1],'#1b1020',1));
}
function cyl(x,y,r,z0,z1,col,top){
  const c=G.c,a=PW(x,y,z0),b=PW(x,y,z1),rx=r*G.TW*.707,ry=r*G.TW*.354;
  c.fillStyle=col;c.beginPath();
  c.ellipse(a[0],a[1],rx,ry,0,0,Math.PI);
  c.lineTo(b[0]-rx,b[1]);c.ellipse(b[0],b[1],rx,ry,0,Math.PI,0,true);
  c.closePath();c.fill();
  c.fillStyle=top;c.beginPath();c.ellipse(b[0],b[1],rx,ry,0,0,7);c.fill();
}
function dome(x,y,r,z,col){
  const c=G.c,a=PW(x,y,z),rx=r*G.TW*.707,ry=r*G.TW*.354,hd=r*G.TW*.6;
  const g=c.createRadialGradient(a[0]-rx*.3,a[1]-hd*.6,2,a[0],a[1],hd+rx*.3);
  g.addColorStop(0,shade(col,1.6));g.addColorStop(1,col);
  c.fillStyle=g;c.beginPath();
  c.ellipse(a[0],a[1],rx,ry,0,0,Math.PI);
  c.ellipse(a[0],a[1],rx,hd,0,Math.PI,2*Math.PI);c.fill();
}
function colon(x0,y0,x1,y1,h,fd){
  const ax=fd[1]!=0,L=ax?x1-x0:y1-y0,n=Math.max(3,Math.round(L*2));
  for(let i=0;i<n;i++){
    const t=.18+i/(n-1)*(L-.36),px=ax?x0+t:(fd[0]>0?x1+.06:x0-.13),py=ax?(fd[1]>0?y1+.06:y0-.13):y0+t;
    box(px,py,px+.07,py+.07,0,h*.78,'#8a84a8','#d8d2ec','#eee');
  }
}
const byD=(a,b)=>PW((a[0]+a[2])/2,(a[1]+a[3])/2)[1]-PW((b[0]+b[2])/2,(b[1]+b[3])/2)[1];

function roofDetails(it, T, w, d, h, mx, my){
  const c = G.c, sc = G.sc;
  const material = getMaterial(it, T);
  const wall = it.wall||T.wall;
  const n = (T.n||'').toLowerCase();
  if(h < .35) return;
  if(material === 'metal'){
    for(let i=0;i<2;i++){ cyl(mx-.25+i*.50, my+.20, .08, h+.02, h+.30, shade(wall,.6), shade(wall,.8)); }
  } else if(material === 'painted'){
    if(T.cat !== 'vivienda'){ cyl(mx+.35, my-.20, .16, h+.02, h+.40, shade(wall,.7), shade(wall,.95)); }
  } else if(material === 'glass' && h > 2 && !(n.includes('torre')||n.includes('tower')||n.includes('oficina'))){
    const base = PW(mx,my,h), top = PW(mx,my,h+.70);
    c.strokeStyle='#888'; c.lineWidth=1.5*sc;
    c.beginPath(); c.moveTo(base[0],base[1]); c.lineTo(top[0],top[1]); c.stroke();
  }
}

function buildingDetails(it,T,w,d,h,x0,y0,x1,y1,mx,my,f,wall,roofCol,sc){
  const c=G.c, n=T.n.toLowerCase();
  const material = getMaterial(it, T);
  const litColor = it.neon||T.neon;
  const lit = isLit(it);

  if(material === 'painted' && T.cat === 'vivienda'){
    for(let i=0;i<3;i++){
      const px = x0 + .2 + i*(w-.4)/2, py = y0 + d + .04;
      const p = PW(px, py, .05);
      c.fillStyle = '#2a7a4a';
      c.beginPath(); c.ellipse(p[0],p[1], 5*sc, 3*sc, 0, 0, 7); c.fill();
    }
    if(h > 1 && lit){
      const pA=PW(x0+.10,y1+.02,h*.55), pB=PW(x1-.15,y1+.02,h*.55);
      c.strokeStyle='rgba(220,220,230,0.55)'; c.lineWidth=1*sc;
      c.beginPath(); c.moveTo(pA[0],pA[1]); c.lineTo(pB[0],pB[1]); c.stroke();
      for(let i=0;i<4;i++){
        const t=i/3, x=pA[0]+(pB[0]-pA[0])*t, y=pA[1]+(pB[1]-pA[1])*t;
        c.fillStyle = ['#ff4bd8','#ffd23f','#7dff7a','#00f0ff'][i];
        c.fillRect(x-1.5*sc, y, 3*sc, 4*sc);
      }
    }
  }
  if(lit && T.cat === 'institucional' && h > 1){
    const p=PW(mx,my,h+.10), s=2.5*sc;
    c.fillStyle='#e8e8ff'; c.shadowColor='#e8e8ff'; c.shadowBlur=4*sc;
    c.fillRect(p[0]-s*.3,p[1]-s,s*.6,s*2);
    c.fillRect(p[0]-s,p[1]-s*.3,s*2,s*.6);
    c.shadowBlur=0;
  }
  if(T.cat === 'industrial'){ cyl(x0+.35, y0+.35, .14, h+.02, h+.32, shade(wall,.75), shade(wall,.95)); }
  if(n.includes('contempor')){
    const dx0 = x0 + w*.55, dy0 = y0;
    box(dx0, dy0, x1, y0+d*.4, h, h+.04, '#a08060','#c0a080','#d0b090');
    const a=PW(dx0, y0+d*.4, h+.04), b=PW(x1, y0+d*.4, h+.04);
    c.strokeStyle='rgba(140,220,255,0.65)'; c.lineWidth=2*sc;
    c.beginPath(); c.moveTo(a[0],a[1]); c.lineTo(b[0],b[1]); c.stroke();
    const pl=PW(x0+w*.8, y0+d*.5, h+.06);
    c.fillStyle='#2a9a5a'; c.beginPath(); c.arc(pl[0], pl[1], 4*sc, 0, 7); c.fill();
  }
  if(lit && n.includes('hospital')){
    const p=PW(mx,my,h+.08),s=5*sc;

/* --------- ANIMACIONES --------- */
function isWalkKind(k){return ['street','road','median','medianx','xwalk'].includes(k)}
function isBuildKind(k){return !isWalkKind(k)&&!['lake','park','tree','kiosk','fountain','mast','green','parkx','trainline','trainx','sign','playground','plaza'].includes(k)}

function collectPedDrawables(items){
  const result=[];
  items.forEach(it=>{
    const T=TYPES[it.t];
    const isKiosk = T.kind=='kiosk';
    if(!isBuildKind(T.kind) && !isKiosk) return;
    const[w,d]=dims(it);
    const sides=[
      {nx:it.x+w/2, ny:it.y-.5, si:0},
      {nx:it.x+w/2, ny:it.y+d+.5, si:1},
      {nx:it.x-.5, ny:it.y+d/2, si:2},
      {nx:it.x+w+.5, ny:it.y+d/2, si:3}
    ];
    sides.forEach(s=>{
      const walk = items.find(o=>{
        if(!isWalkKind(TYPES[o.t].kind))return false;
        const[ow,od]=dims(o);
        return s.nx>=o.x&&s.nx<o.x+ow&&s.ny>=o.y&&s.ny<o.y+od;
      });
      if(!walk)return;
      const wk = TYPES[walk.t].kind;
      let cnt = 2;
      if(wk=='median'||wk=='medianx') cnt = 10;
      let ax,ay,bx,by;
      if(s.si==0){ax=it.x; ay=it.y-.25; bx=it.x+w; by=it.y-.25;}
      else if(s.si==1){ax=it.x; ay=it.y+d+.25; bx=it.x+w; by=it.y+d+.25;}
      else if(s.si==2){ax=it.x-.25; ay=it.y; bx=it.x-.25; by=it.y+d;}
      else {ax=it.x+w+.25; ay=it.y; bx=it.x+w+.25; by=it.y+d;}
      for(let i=0;i<cnt;i++){
        const phase=((animT*0.22+i*0.13+s.si*0.19+it.x*0.11+it.y*0.07)%1);
        const t=i%2?1-phase:phase;
        const px=ax+(bx-ax)*t, py=ay+(by-ay)*t;
        result.push({x:px, y:py, color: i%2?'#ffd28a':'#8affd2'});
      }
    });
  });
  return result;
}
function drawPedAt(p){
  const c=G.c;
  const pw=PW(p.x,p.y,.02), sp=PW(p.x,p.y,0);
  c.fillStyle='rgba(0,0,0,.45)';
  c.beginPath();c.ellipse(sp[0],sp[1],2.8*G.sc,1.3*G.sc,0,0,7);c.fill();
  c.fillStyle=p.color;
  c.beginPath();c.arc(pw[0],pw[1],2.2*G.sc,0,7);c.fill();
}

function collectPlazaCrowdDrawables(items){
  const result=[];
  const isWalk=(k)=>['street','road','xwalk','median','medianx'].includes(k);
  items.forEach(it=>{
    const T=TYPES[it.t];
    if(T.kind!=='plaza') return;
    const [w,d]=dims(it);
    let hasStreet=false;
    for(const o of items){
      const oT=TYPES[o.t];
      if(!isWalk(oT.kind)) continue;
      const [ow,od]=dims(o);
      if(o.x<it.x+w && o.x+ow>it.x){ if(o.y+od===it.y || o.y===it.y+d){hasStreet=true;break;} }
      if(o.y<it.y+d && o.y+od>it.y){ if(o.x+ow===it.x || o.x===it.x+w){hasStreet=true;break;} }
    }
    if(!hasStreet) return;
    for(let g=0; g<2; g++){
      const gxBase = it.x + 0.30 + hs(it.x*11 + g*7 + it.y*3) * (w - 0.6);
      const gyBase = it.y + 0.30 + hs(it.y*13 + g*5 + it.x*2) * (d - 0.6);
      if(Math.abs(gxBase-(it.x+w/2))<0.28 && Math.abs(gyBase-(it.y+d/2))<0.28) continue;
      const cnt = 3 + Math.floor(hs(gxBase*7 + gyBase*11) * 2);
      for(let i=0;i<cnt;i++){
        const ang=(i/cnt)*Math.PI*2 + hs(i*3+g)*1.5;
        const r=0.05 + hs(i*7+g*3)*0.04;
        result.push({
          x: gxBase + Math.cos(ang)*r,
          y: gyBase + Math.sin(ang)*r,
          color: ['#ffd28a','#8affd2','#ffb3d2','#b3d2ff','#d4ff8a'][i % 5]
        });
      }
    }
  });
  return result;
}

function vehiclePaths(items){
  const paths=[],cell={};
  items.forEach(o=>{const[w,d]=dims(o);for(let x=o.x;x<o.x+w;x++)for(let y=o.y;y<o.y+d;y++)cell[x+','+y]=o});
  const isR=(x,y)=>{ const o=cell[x+','+y]; if(!o) return false; const k=TYPES[o.t].kind; return k==='street'||k==='road'||k==='median'; };
  const isI=(x,y)=>{ const o=cell[x+','+y]; if(!o) return false; const k=TYPES[o.t].kind; return k==='xwalk'||k==='medianx'; };
  for(let y=0;y<12;y++){
    let x=0;
    while(x<12){
      if(isR(x,y)){
        let x0=x; while(x<12 && isR(x,y)) x++;
        const x1=x-1;
        if(x1>=x0 && isI(x0-1,y) && isI(x1+1,y)) paths.push({dir:'h', x0, x1, y});
      } else x++;
    }
  }
  for(let x=0;x<12;x++){
    let y=0;
    while(y<12){
      if(isR(x,y)){
        let y0=y; while(y<12 && isR(x,y)) y++;
        const y1=y-1;
        if(y1>=y0 && isI(x,y0-1) && isI(x,y1+1)) paths.push({dir:'v', y0, y1, x});
      } else y++;
    }
  }
  return paths;
}
function collectVehDrawables(items){
  const result=[];
  const paths=vehiclePaths(items);
  paths.forEach((path,pi)=>{
    const speed=0.18, len = path.dir==='h' ? (path.x1-path.x0) : (path.y1-path.y0);
    const num=Math.max(1,Math.floor(len/2.5));
    for(let i=0;i<num;i++){
      const phase=((animT*speed/len + i/num + pi*0.37)%1);
      let px,py;
      if(path.dir==='h'){px=path.x0+.5+phase*len; py=path.y+.5}
      else{px=path.x+.5; py=path.y0+.5+phase*len}
      const trail=[];
      for(let k=1;k<=8;k++){
        const t2=phase-k*0.018;
        if(t2<0)break;
        let tx,ty;
        if(path.dir==='h'){tx=path.x0+.5+t2*len; ty=path.y+.5}
        else{tx=path.x+.5; ty=path.y0+.5+t2*len}
        trail.push({x:tx, y:ty, size:2.6*(1-k/10), alpha:.38*(1-k/8)});
      }
      result.push({x:px, y:py, trail});
    }
  });
  return result;
}
function drawVehAt(v){
  const c=G.c;
  v.trail.forEach(tp=>{
    const p=PW(tp.x, tp.y, .06);
    c.globalAlpha=tp.alpha; c.fillStyle='#ff4bd8';
    c.beginPath();c.arc(p[0], p[1], tp.size*G.sc, 0, 7);c.fill();

  const p=PW(v.x, v.y, .08);

  c.beginPath();c.arc(p[0],p[1],3*G.sc,0,7);c.fill();c.shadowBlur=0;
}

function collectTrainDrawables(items){
  const result=[];
  const cell={};
  items.forEach(o=>{const[w,d]=dims(o);for(let x=o.x;x<o.x+w;x++)for(let y=o.y;y<o.y+d;y++)cell[x+','+y]=o});
  const isT=(x,y)=>{ const o=cell[x+','+y]; if(!o) return false; const k=TYPES[o.t].kind; return k==='trainline'||k==='trainx'; };
  const isX=(x,y)=>{ const o=cell[x+','+y]; return o && TYPES[o.t].kind==='trainx'; };
  for(let y=0;y<12;y++){
    let x=0;
    while(x<12){
      if(isT(x,y)){
        let x0=x; while(x<12&&isT(x,y)) x++;
        const x1=x-1;
        if(x1>x0 && isX(x0,y) && isX(x1,y)){
          const t=((animT*0.12)%1);
          result.push({x:x0+.5+t*(x1-x0), y:y+.5, fwd: t>0.5});
        }
      } else x++;
    }
  }
  for(let x=0;x<12;x++){
    let y=0;
    while(y<12){
      if(isT(x,y)){
        let y0=y; while(y<12&&isT(x,y)) y++;
        const y1=y-1;
        if(y1>y0 && isX(x,y0) && isX(x,y1)){
          const t=((animT*0.12)%1);
          result.push({x:x+.5, y:y0+.5+t*(y1-y0), fwd: t>0.5});
        }
      } else y++;
    }
  }
  return result;
}

function spawnFirework(){
  const W=G.W,H=G.H;
  const x=W*(0.1+Math.random()*0.8);
  const y0=H*0.72;
  const y1=H*(0.1+Math.random()*0.22);
  const hue=Math.random()*360;
  fxp.fireworks.push({x,y:y0,y0,y1,vy:-3-Math.random()*2,exploded:false,color:`hsl(${hue},90%,68%)`,particles:[]});
}
function explode(f){
  const n=28+Math.floor(Math.random()*22);
  const baseHue=Math.random()*360;
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, sp=1+Math.random()*3;
    f.particles.push({x:f.x,y:f.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,
      color:`hsl(${(baseHue+Math.random()*60)|0},90%,68%)`});
  }
}
function updateFX(dt){
  if(FX.fuegos){
    fxTimer-=dt;
    if(fxTimer<=0){fxTimer=0.8+Math.random()*1.2;spawnFirework()}
  }
  fxp.fireworks.forEach(f=>{
    if(!f.exploded){
      f.y+=f.vy*dt*60;
      if(f.y<=f.y1){f.exploded=true;explode(f)}
    }else{
      f.particles.forEach(p=>{p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;p.vy+=0.06*dt*60;p.life-=dt*0.6});
      f.particles=f.particles.filter(p=>p.life>0);
    }
  });
  fxp.fireworks=fxp.fireworks.filter(f=>!f.exploded||f.particles.length>0);
}

function visibleSides(){
  const v=G.view;
  if(v==0) return ['s','e'];
  if(v==1) return ['w','s'];
  if(v==2) return ['n','w'];
  return ['e','n'];
}

function drawNavidadForItem(it){
  if(!FX.navidad) return;
  const T=TYPES[it.t],h=it.h||T.h;
  if(h<0.5||!isBuildKind(T.kind)) return;
  const c=G.c;
  const vis=visibleSides();
  const[w,d]=dims(it);
  const x0=it.x,y0=it.y,x1=it.x+w,y1=it.y+d,z=.35;
  const sides=[];
  if(vis.includes('n')) sides.push([[x0,y0],[x1,y0]]);
  if(vis.includes('s')) sides.push([[x0,y1],[x1,y1]]);
  if(vis.includes('e')) sides.push([[x1,y0],[x1,y1]]);
  if(vis.includes('w')) sides.push([[x0,y0],[x0,y1]]);
  sides.forEach(([a,b])=>{
    const L=Math.hypot(b[0]-a[0],b[1]-a[1]);
    const n=Math.max(2,Math.ceil(L*4));
    for(let i=0;i<=n;i++){
      const t=i/n,px=a[0]+(b[0]-a[0])*t,py=a[1]+(b[1]-a[1])*t;
      const p=PW(px,py,z);
      const pulse=0.55+0.45*Math.sin(animT*4+i*0.7+it.x*0.3+it.y*0.2);
      const col=['#ff5050','#ffd060','#50ff80','#50c0ff'][i%4];
      c.fillStyle=col;c.shadowColor=col;c.shadowBlur=8*G.sc*(0.6+pulse*0.4);c.globalAlpha=0.5+pulse*0.5;
      c.beginPath();c.arc(p[0],p[1],2.4*G.sc,0,7);c.fill();
    }
  });
  c.globalAlpha=1;c.shadowBlur=0;
}

function drawEstrobo(items){
  const c=G.c,phase=Math.floor(animT*10);
  items.forEach((it,i)=>{
    const T=TYPES[it.t];
    if(!isBuildKind(T.kind)||!isLit(it))return;
    if((phase+i*3)%7!==0)return;
    const[w,d]=dims(it);
    const p=PW(it.x+w/2,it.y+d/2,(it.h||T.h)*0.55);
    sglow(p[0],p[1],'#ffffff',G.TW*1.2,'aa');
  });
}
function drawRain(){
  const c=G.c,W=G.W,H=G.H,t=animT;
  c.save();c.strokeStyle='rgba(150,200,255,0.55)';c.lineWidth=1.2;
  for(let i=0;i<160;i++){
    const seed=i*13.7;
    const x=((seed*37+t*180)%(W+40))-20;
    const y=((seed*17+t*900)%(H+30))-15;
    c.beginPath();c.moveTo(x,y);c.lineTo(x-4,y+16);c.stroke();
  }
  c.restore();
}
function drawSnow(){
  const c=G.c,W=G.W,H=G.H,t=animT;
  c.save();
  for(let i=0;i<90;i++){
    const seed=i*23.1;
    const x=((seed*41+Math.sin(t+i)*20+t*15)%W);
    const y=((seed*13+t*40)%H);
    const r=1.5+((seed*7)%2);
    c.fillStyle='rgba(255,255,255,0.85)';
    c.beginPath();c.arc(x,y,r,0,7);c.fill();
  }
  c.restore();
}
function drawConfetti(){
  const c=G.c,W=G.W,H=G.H,t=animT;
  c.save();
  for(let i=0;i<70;i++){
    const seed=i*17.3;
    const x=((seed*37+t*60)%W);
    const y=((seed*19+t*120)%H);
    const hue=(seed*47)%360;
    c.fillStyle=`hsl(${hue},90%,62%)`;
    c.save();c.translate(x,y);c.rotate(t*3+i);
    c.fillRect(-3,-2,6,4);c.restore();
  }
  c.restore();
}
function drawBirds(){
  const c=G.c,W=G.W,H=G.H,t=animT;
  c.save();c.strokeStyle='#111';c.lineWidth=2;
  for(let i=0;i<6;i++){
    const seed=i*29.7;
    const x=((seed*41+t*70)%(W+200))-100;
    const y=H*0.12+(seed*7%90)+Math.sin(t*2+i)*8;
    c.beginPath();c.moveTo(x-6,y);c.quadraticCurveTo(x,y-5,x+6,y);c.stroke();
  }
  c.restore();
}
function drawFireworks(){
  const c=G.c;
  fxp.fireworks.forEach(f=>{
    if(!f.exploded){
      c.fillStyle=f.color;c.shadowColor=f.color;c.shadowBlur=14;
      c.beginPath();c.arc(f.x,f.y,3,0,7);c.fill();
      for(let k=1;k<8;k++){
        c.globalAlpha=0.35*(1-k/8);
        c.beginPath();c.arc(f.x,f.y+k*8,2.2*(1-k/10),0,7);c.fill();
      }
      c.globalAlpha=1;c.shadowBlur=0;
    }else{
      f.particles.forEach(p=>{
        c.globalAlpha=Math.max(0,p.life);
        c.fillStyle=p.color;c.shadowColor=p.color;c.shadowBlur=10;
        c.beginPath();c.arc(p.x,p.y,2.4,0,7);c.fill();
      });
      c.globalAlpha=1;c.shadowBlur=0;
    }
  });
}
function drawEffects(items){
  if(FX.lluvia)drawRain();
  if(FX.nieve)drawSnow();
  if(FX.confeti)drawConfetti();
  if(FX.pajaros)drawBirds();

/* --------- RENDER --------- */
function render(items,o={}){
  const c=G.c,{W,H,S,TW,TH,HZ,cx,cy}=G;
  const g=c.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0f1a66');g.addColorStop(.55,'#231a70');g.addColorStop(1,'#a0237f');
  c.fillStyle=g;c.fillRect(0,0,W,H);
  sglow(cx,cy+S*TH/2+HZ*.5,'#ff3cc8',S*TW*.62,'66',.45);
  poly([P(0,S,0),P(S,S,0),P(S,S,-.45),P(0,S,-.45)],'#3a1244');
  poly([P(S,0,0),P(S,S,0),P(S,S,-.45),P(S,0,-.45)],'#52184f');
  if(showGrid){
    for(let x=0;x<S;x++)for(let y=0;y<S;y++)gpoly(x,y,x+1,y+1,(x+y)%2?'#171942':'#1b1d49','rgba(120,140,255,.1)');
  } else {
    gpoly(0,0,S,S,'#171942');
  }
  poly([P(0,0,0),P(S,0,0),P(S,S,0),P(0,S,0)],null,'#7a4ab0',2);
  (o.out||[]).forEach(a=>poly([PW(a[0],a[1]),PW(a[0]+12,a[1]),PW(a[0]+12,a[1]+12),PW(a[0],a[1]+12)],null,'#ff4bd8',2));

  items.forEach(it=>gnd(it,items));

  if(o.ghost){const[w,d]=dims(o.ghost);gpoly(o.ghost.x,o.ghost.y,o.ghost.x+w,o.ghost.y+d,o.ok?'rgba(0,255,160,.35)':'rgba(255,60,90,.45)')}
  if(o.er)gpoly(o.er[0],o.er[1],o.er[0]+1,o.er[1]+1,'rgba(255,60,90,.45)');

  const drawables = [];
  items.forEach(it => {
    const [w,d] = dims(it);
    const ccx = it.x + w/2, ccy = it.y + d/2;
    const r = rot(ccx, ccy);
    drawables.push({ depth: r[0]+r[1], type: 'obj', it });
  });
  if (o.ghost) {
    const [w,d] = dims(o.ghost);
    const ccx = o.ghost.x + w/2, ccy = o.ghost.y + d/2;
    const r = rot(ccx, ccy);
    drawables.push({ depth: r[0]+r[1], type: 'ghost', it: o.ghost });
  }

  collectPlazaCrowdDrawables(items).forEach(p => {
    const r = rot(p.x, p.y);
    drawables.push({ depth: r[0]+r[1], type: 'ped', data: p });
  });

  if (!o.noAnim) {
    collectPedDrawables(items).forEach(p => {
      const r = rot(p.x, p.y);
      drawables.push({ depth: r[0]+r[1], type: 'ped', data: p });
    });
    collectVehDrawables(items).forEach(v => {
      const r = rot(v.x, v.y);
      drawables.push({ depth: r[0]+r[1], type: 'veh', data: v });
    });
    collectTrainDrawables(items).forEach(t => {
      const r = rot(t.x, t.y);
      drawables.push({ depth: r[0]+r[1], type: 'train', data: t });
    });
  }
  drawables.sort((a,b) => a.depth - b.depth);
  drawables.forEach(d => {
    if (d.type === 'obj') {
      c.globalAlpha = 1;
      obj(d.it);
      if (!o.noAnim) drawNavidadForItem(d.it);
    } else if (d.type === 'ghost') {
      c.globalAlpha = .65;
      obj(d.it);
      c.globalAlpha = 1;
    } else if (d.type === 'ped') {
      drawPedAt(d.data);
    } else if (d.type === 'veh') {
      drawVehAt(d.data);
    } else if (d.type === 'train') {
      drawTrainAt(d.data);
    }
  });

  if(!o.noAnim){
    if(FX.lluvia) drawWetSurfaces(items);
    if(FX.nieve) drawSnowSurfaces(items);
    drawEffects(items);
    const hasAnim = items.some(it => {
      const T = TYPES[it.t];
      return T.shape==='led' || T.shape==='ledH' || T.shape==='ledDot' ||
             T.shape==='scr' || it.signMode==='digital' || it.roofLights>0 ||
             isWalkKind(T.kind) || T.kind==='trainline' || T.kind==='trainx';
    }) || Object.values(FX).some(v=>v);
    if (hasAnim) needsAnim = true;
  }
}

function fits(t,x,y,rotn,items,fw,fd,excludeIdx=-1){
  const[w,d]=dims({t,rot:rotn,fw,fd});
  if(x<0||y<0||x+w>12||y+d>12)return false;
  return !items.some((o,i)=>{
    if(i===excludeIdx)return false;
    const[ow,od]=dims(o);
    return x<o.x+ow&&x+w>o.x&&y<o.y+od&&y+d>o.y;
  });
}
function ghostAt(){
  if(!placing)return null;
  const T=TYPES[selType],fw=selFw??T.w,fd=selFd??T.d;
  const[w,d]=dims({t:selType,rot:prot,fw,fd});
  let gx,gy;
  if(outside||!hover){
    gx=Math.max(0,Math.floor((12-w)/2));
    gy=Math.max(0,Math.floor((12-d)/2));
  } else {
    gx=hover[0]-Math.floor(w/2);
    gy=hover[1]-Math.floor(d/2);
  }
  return{t:selType,rot:prot,h:selH,fw,fd,x:gx,y:gy};
}
function draw(){
  updatePlacingInfo();
  resizeCanvas(cv);
  setup(cv.getContext('2d'),12,view,cam.zoom,cam.panX,cam.panY);
  EG=Object.assign({},G);
  const gh=mode=='place'?ghostAt():null;
  render(cur.items,{ghost:gh,ok:gh&&fits(gh.t,gh.x,gh.y,gh.rot,cur.items,gh.fw,gh.fd),er:mode=='erase'&&hover?hover:null});
}
function cellAt(e){
  const r=cv.getBoundingClientRect(),sx=(e.clientX-r.left)*cv.width/r.width,sy=(e.clientY-r.top)*cv.height/r.height;
  const a=(sx-EG.cx)/(EG.TW/2),b=(sy-EG.cy)/(EG.TH/2),rx=(a+b)/2,ry=(b-a)/2,S=12,v=view;
  const p=v==0?[rx,ry]:v==1?[ry,S-rx]:v==2?[S-rx,S-ry]:[S-ry,rx];
  return[Math.floor(p[0]),Math.floor(p[1])];
}
function itemAt(cx,cy){
  const sorted=cur.items.map((o,i)=>({o,i,z:o.x+o.y})).sort((a,b)=>b.z-a.z);
  for(const{o,i}of sorted){const[w,d]=dims(o);if(cx>=o.x&&cx<o.x+w&&cy>=o.y&&cy<o.y+d)return i}
  return -1;
}
function eraseAt(c){const i=itemAt(c[0],c[1]);if(i>=0){cur.items.splice(i,1);if(selItemIdx==i)selectItem(-1);else if(selItemIdx>i)selItemIdx--;refreshAnim()}}

function refreshAnim(){
  needsAnim=cur.items.some(it=>{
    const T=TYPES[it.t];
    return T.shape==='led'||T.shape==='ledH'||T.shape==='ledDot'||
           T.shape==='scr'||it.signMode==='digital'||it.roofLights>0||
           isWalkKind(T.kind)||T.kind==='trainline'||T.kind==='trainx';
  })||Object.values(FX).some(v=>v);
}

function selectItem(idx){
  selItemIdx=idx;
  if(idx>=0){
    const it=cur.items[idx],T=TYPES[it.t];
    it.wallMaterial=it.wallMaterial||getMaterial(it,T);
    $('selnm').value=it.label!==undefined?it.label:(T.sign||'');
    $('selcol').value=toHex(it.neon||T.neon);
    $('selwall').value=toHex(it.wall||T.wall);
    $('selroof').value=toHex(it.roof||T.roof||shade(it.wall||T.wall,.7));
    $('selLED').value=toHex(it.ledCol||it.neon||T.neon);
    $('selRL').value=it.roofLights||0;
    $('selRLc').value=toHex(it.roofLightsCol||'#ffd23f');
    $('selmode').value=it.signMode||(T.shape==='scr'?'digital':'fixed');
    $('selroadc').value=toHex(it.roadColor||'#2a2a3a');
    $('selbar').hidden=false;
    const noLabel=T.cat==='via'||T.cat==='naturaleza';
    $('selnm').parentElement.style.display=noLabel?'none':'';
    $('selcol').parentElement.style.display=noLabel?'none':'';
    $('selmode').parentElement.style.display=noLabel?'none':'';
    $('selroadc').parentElement.style.display=(T.kind==='road')?'':'none';
  }else{
    $('selbar').hidden=true;
  }
}
function toHex(c){
  if(!c)return '#000000';
  if(c.startsWith('#'))return c;
  const m=c.match(/rgb\((\d+),\s*(\d+),\s*(\d+)\)/);
  if(m){const r=(+m[1]).toString(16).padStart(2,'0'),g=(+m[2]).toString(16).padStart(2,'0'),b=(+m[3]).toString(16).padStart(2,'0');return '#'+r+g+b}
  return '#000000';
}

function placeGhost(){
  const g=ghostAt();
  if(g&&fits(g.t,g.x,g.y,g.rot,cur.items,g.fw,g.fd)){
    cur.items.push({t:g.t,x:g.x,y:g.y,rot:g.rot,h:g.h,fw:g.fw,fd:g.fd,
                    wallMaterial:getMaterial(g,TYPES[g.t]),_t0:Date.now()});
    refreshAnim();
    return true;
  }
  return false;
}

/* --------- POINTERS --------- */
let dragCam=null, dragItem=null, touchPlaceStart=null;
const activePointers=new Map();
let pinchStart=null;

cv.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse' && e.button!==0) return;
  activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  try{cv.setPointerCapture(e.pointerId)}catch(_){}

  if(activePointers.size===2){
    dragCam=null;dragItem=null;touchPlaceStart=null;
    const [p1,p2]=[...activePointers.values()];
    const dx=p1.x-p2.x, dy=p1.y-p2.y;
    pinchStart={
      dist:Math.max(1,Math.hypot(dx,dy)),
      mx:(p1.x+p2.x)/2,
      my:(p1.y+p2.y)/2,
      zoom:cam.zoom,
      panX:cam.panX,
      panY:cam.panY
    };
    return;
  }
  if(activePointers.size>2) return;

  const cell=cellAt(e);
  const idx=itemAt(cell[0],cell[1]);

  if(idx>=0 && mode!=='erase'){
    ghostArmed=false;
    selectItem(idx);
    dragItem={idx,offX:cell[0]-cur.items[idx].x,offY:cell[1]-cur.items[idx].y,startX:e.clientX,startY:e.clientY,moved:false};
    draw();
    return;
  }
  if(mode==='erase'){
    dragCam={x:e.clientX,y:e.clientY,panX:cam.panX,panY:cam.panY,moved:false};
    return;
  }
  if(mode==='place' && placing){
    if(e.pointerType==='mouse'){
      dragCam={x:e.clientX,y:e.clientY,panX:cam.panX,panY:cam.panY,moved:false};
      return;
    }
    if(ghostArmed){
      const ok=placeGhost();
      if(ok) ghostArmed=false;
      draw();
      return;
    }
    outside=false;
    hover=cell;
    touchPlaceStart={x:e.clientX,y:e.clientY,moved:false};
    draw();
    return;
  }
  dragCam={x:e.clientX,y:e.clientY,panX:cam.panX,panY:cam.panY,moved:false};
});

cv.addEventListener('pointermove',e=>{
  if(activePointers.has(e.pointerId)){
    activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});

    if(pinchStart && activePointers.size>=2){
      const pts=[...activePointers.values()].slice(0,2);
      const [p1,p2]=pts;
      const dx=p1.x-p2.x, dy=p1.y-p2.y;
      const dist=Math.max(1,Math.hypot(dx,dy));
      const scale=dist/pinchStart.dist;
      cam.zoom=Math.max(0.4,Math.min(3.5,pinchStart.zoom*scale));
      const mx=(p1.x+p2.x)/2, my=(p1.y+p2.y)/2;
      const kx=cv.width/cv.clientWidth, ky=cv.height/cv.clientHeight;
      cam.panX=pinchStart.panX+(mx-pinchStart.mx)*kx;
      cam.panY=pinchStart.panY+(my-pinchStart.my)*ky;
      draw();
      return;
    }

    if(touchPlaceStart){
      const dx=e.clientX-touchPlaceStart.x;
      const dy=e.clientY-touchPlaceStart.y;
      if(Math.abs(dx)>3||Math.abs(dy)>3) touchPlaceStart.moved=true;
      outside=false;
      hover=cellAt(e);
      draw();
      return;
    }

    if(dragItem){
      const dx=e.clientX-dragItem.startX, dy=e.clientY-dragItem.startY;
      if(Math.abs(dx)>3||Math.abs(dy)>3)dragItem.moved=true;
      if(dragItem.moved){
        hover=cellAt(e);
        const it=cur.items[dragItem.idx];
        const newX=hover[0]-dragItem.offX, newY=hover[1]-dragItem.offY;
        if(fits(it.t,newX,newY,it.rot,cur.items,it.fw,it.fd,dragItem.idx)){
          it.x=newX; it.y=newY;
          draw();
        }
      }
      return;
    }

    if(dragCam){
      const dx=e.clientX-dragCam.x, dy=e.clientY-dragCam.y;
      if(Math.abs(dx)>3||Math.abs(dy)>3)dragCam.moved=true;
      if(dragCam.moved){
        cam.panX=dragCam.panX+dx*(cv.width/cv.clientWidth);
        cam.panY=dragCam.panY+dy*(cv.height/cv.clientHeight);
        draw();
      }
      return;
    }
  }
  outside=false;
  hover=cellAt(e);
  draw();
});

cv.addEventListener('pointerup',e=>{
  activePointers.delete(e.pointerId);

  if(pinchStart){ if(activePointers.size<2) pinchStart=null; return; }

  if(touchPlaceStart){
    touchPlaceStart=null;
    ghostArmed=true;
    draw();
    return;
  }

  if(dragItem){ dragItem=null; return; }

  if(dragCam){
    const wasDrag=dragCam.moved;
    dragCam=null;
    if(!wasDrag && activePointers.size===0){
      hover=cellAt(e);
      handleClick(hover);
    }
    return;
  }
});

cv.addEventListener('pointercancel',e=>{
  activePointers.delete(e.pointerId);
  if(activePointers.size<2) pinchStart=null;
  dragCam=null;dragItem=null;touchPlaceStart=null;
});

cv.addEventListener('pointerleave',()=>{
  if(activePointers.size>0||dragItem||dragCam||touchPlaceStart)return;
  outside=true;hover=null;
  if(placing)draw();
});
cv.addEventListener('pointerenter',()=>{outside=false});

cv.addEventListener('contextmenu',e=>{
  e.preventDefault();
  const cell=cellAt(e);
  if(selItemIdx>=0){
    cur.items[selItemIdx].rot=(cur.items[selItemIdx].rot+1)%4;
    refreshAnim();draw();
  } else {
    eraseAt(cell);refreshAnim();draw();
  }
});
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  const f=e.deltaY>0?0.92:1.08;
  cam.zoom=Math.max(0.4,Math.min(3.5,cam.zoom*f));
  draw();
},{passive:false});

document.addEventListener('pointermove',e=>{
  if(e.target===cv||cv.contains(e.target))return;
  if(!outside){outside=true;if(placing)draw();}
});

function handleClick(cell){
  if(!cell)return;
  const idx=itemAt(cell[0],cell[1]);
  if(mode=='erase'){
    if(idx>=0){cur.items.splice(idx,1);if(selItemIdx>=0){if(selItemIdx==idx)selectItem(-1);else if(selItemIdx>idx)selItemIdx--}refreshAnim()}
    draw();return;
  }
  if(idx>=0){selectItem(idx);draw();return}
  if(mode=='place'&&placing){
    const g=ghostAt();
    if(g&&fits(g.t,g.x,g.y,g.rot,cur.items,g.fw,g.fd)){
      cur.items.push({t:g.t,x:g.x,y:g.y,rot:g.rot,h:g.h,fw:g.fw,fd:g.fd,
                      wallMaterial:getMaterial(g,TYPES[g.t]),_t0:Date.now()});
      refreshAnim();
    }
    selectItem(-1);draw();
  }else{
    selectItem(-1);draw();
  }
}

const typeThumbCache={};
function genTypeThumb(typeIdx){
  if(typeThumbCache[typeIdx]) return typeThumbCache[typeIdx];
  const T=TYPES[typeIdx];
  const keepG=G, keepNeeds=needsAnim, keepAnimT=animT, keepTICK=TICK, keepGrid=showGrid;

  const c=document.createElement('canvas');
  c.width=140;c.height=140;

  const isFlat = T.h === 0;
  const S = isFlat
    ? Math.max(T.w, T.d) + 0.3
    : Math.max(T.w+0.5, T.d+0.5, (T.hmax||T.h)*0.75) + 0.4;

  setup(c.getContext('2d'), S, 0, 1, 0, 0);
  showGrid = !isFlat;

  const item={t:typeIdx,x:(S-T.w)/2,y:(S-T.d)/2,rot:0,h:T.h};

  // try/catch por si algún tipo futuro introduce un color inválido — NO detiene la generación
  try{
    render([item],{noAnim:true});
  }catch(err){
    console.warn('Thumb falló para type', typeIdx, T.n, err);
    // Fallback: fondo con el color de pared del tipo
    const ctx = c.getContext('2d');
    ctx.fillStyle = T.wall || '#333';
    ctx.fillRect(0,0,c.width,c.height);
    ctx.strokeStyle = T.neon || '#00f0ff';
    ctx.lineWidth = 4;
    ctx.strokeRect(6,6,c.width-12,c.height-12);
  }

  G=keepG;needsAnim=keepNeeds;animT=keepAnimT;TICK=keepTICK;showGrid=keepGrid;
  typeThumbCache[typeIdx]=c.toDataURL('image/png');
  return typeThumbCache[typeIdx];
}

let pickerCat=null;
const pickerEl=$('picker'), pickerBody=$('pickerBody'), pickerTitle=$('pickerTitle'),
      pickerBack=$('pickerBack'), pickerClose=$('pickerClose'), pickerBtn=$('pickerBtn');

function renderPicker(){
  pickerBody.innerHTML='';
  if(pickerCat===null){
    pickerTitle.textContent='Categorías';
    pickerBack.hidden=true;
    const grid=document.createElement('div');
    grid.className='picker-cats';
    CATS.forEach(cat=>{
      const count=TYPES.filter(t=>t.cat===cat.id).length;
      if(!count)return;
      const btn=document.createElement('button');
      btn.type='button';
      btn.className='picker-cat';
      btn.innerHTML=`<span class="picker-cat-icon">${cat.icon||'▸'}</span>
        <span style="flex:1;min-width:0"><b>${cat.name}</b><small>${count} edificios</small></span>`;
      btn.onclick=()=>{pickerCat=cat.id;renderPicker()};
      grid.appendChild(btn);
    });
    pickerBody.appendChild(grid);
  } else {
    const cat=CATS.find(c=>c.id===pickerCat);
    pickerTitle.textContent=cat?cat.name:'Edificios';
    pickerBack.hidden=false;
    const grid=document.createElement('div');
    grid.className='picker-items';
    TYPES.forEach((t,i)=>{
      if(t.cat!==pickerCat)return;
      const btn=document.createElement('button');
      btn.type='button';
      btn.className='picker-item'+(i===selType&&mode==='place'?' on':'');
      const img=document.createElement('img');
      img.alt=t.n;
      try{ img.src=genTypeThumb(i); }catch(_){ img.src='data:image/gif;base64,R0lGODlhAQABAAAAACw='; }
      const label=document.createElement('b');
      label.textContent=t.n;
      btn.appendChild(img);
      btn.appendChild(label);
      btn.onclick=()=>{
        selType=i;selH=t.h;selFw=null;selFd=null;
        placing=true;mode='place';ghostArmed=false;hover=null;
        $('tber').classList.remove('on');
        selectItem(-1);
        closePicker();
        refreshAnim();draw();
      };
      grid.appendChild(btn);
    });
    pickerBody.appendChild(grid);
  }
}

function openPicker(){ pickerCat=null; renderPicker(); pickerEl.classList.add('show'); pickerBtn.classList.add('open'); }
function closePicker(){ pickerEl.classList.remove('show'); pickerBtn.classList.remove('open'); }
pickerBtn.onclick=()=>{ pickerEl.classList.contains('show')?closePicker():openPicker(); };
pickerClose.onclick=closePicker;
pickerBack.onclick=()=>{pickerCat=null;renderPicker()};
document.addEventListener('pointerdown',e=>{
  if(!pickerEl.classList.contains('show'))return;
  if(pickerEl.contains(e.target)||pickerBtn.contains(e.target))return;
  closePicker();
});

  else{const T=TYPES[selType];selFw=Math.max(1,(selFw??T.w)-1);selFd=Math.max(1,(selFd??T.d)-1);draw()}

$('tber').onclick=()=>{mode=mode=='erase'?'place':'erase';ghostArmed=false;$('tber').classList.toggle('on',mode=='erase');draw()};

function thumb(items){
  const keepG=G,keepCam={...cam},keepGrid=showGrid;
  cam.zoom=1;cam.panX=0;cam.panY=0;showGrid=true;
  const c=document.createElement('canvas');c.width=300;c.height=290;
  setup(c.getContext('2d'),12,0,1,0,0);
  render(items,{noAnim:true});
  G=keepG;Object.assign(cam,keepCam);showGrid=keepGrid;
  return c.toDataURL('image/png');
}

$('bsave').onclick=()=>{
  if(!cur.items.length){alert('Agrega algunos edificios antes de generar el diorama.');return}
  const d={id:cur.id||Date.now(),name:$('nm').value.trim()||'Diorama '+(lib.length+1),items:JSON.parse(JSON.stringify(cur.items)),th:thumb(cur.items)};
  const i=lib.findIndex(o=>o.id==d.id);
  if(i<0){lib.push(d);cur.id=d.id}else{lib[i]=d}
  persist();all();showSaveToast();
};
$('bdl1').onclick=()=>{

  link.href=cv.toDataURL('image/png');
  link.click();
};
$('bload').onclick=()=>openLoad();
$('bnew').onclick=()=>{
  if(cur.items.length>0 && !confirm('⚠ Si no has guardado el diorama actual, se perderá. ¿Crear un nuevo diorama?'))return;
  cur={items:[],id:null};
  $('nm').value='';selectItem(-1);ghostArmed=false;refreshAnim();draw();
};

function openLoad(){
  const list=$('loadlist');list.innerHTML='';
  if(!lib.length){list.textContent='Aún no hay dioramas guardados.'}
  else{
    lib.forEach(d=>{
      const e=document.createElement('div');e.className='card';
      const im=document.createElement('img');im.src=d.th;im.alt='';
      const nm=document.createElement('b');nm.textContent=d.name;
      e.append(im,nm);
      e.onclick=()=>{
        if(cur.items.length>0 && !confirm('Se reemplazarán los cambios no guardados. ¿Continuar?'))return;
        const now=Date.now();
        cur={items:JSON.parse(JSON.stringify(d.items)).map(o=>({...o,_t0:o._t0||now})),id:d.id};
        $('nm').value=d.name;
        selectItem(-1);ghostArmed=false;refreshAnim();
        $('loadmodal').hidden=true;
        draw();
      };
      list.appendChild(e);
    });
  }
  $('loadmodal').hidden=false;
}
$('loadclose').onclick=()=>{$('loadmodal').hidden=true};

function cards(host,pick){
  host.innerHTML='';
  if(!lib.length){host.textContent='Aún no hay dioramas guardados.';host.className=pick?'':'strip hint';return}
  lib.forEach(d=>{
    const e=document.createElement('div');e.className='card'+(pick&&d.id==selLib?' on':'');
    const im=document.createElement('img');im.src=d.th;im.alt='';
    const nm=document.createElement('b');nm.textContent=d.name;
    e.append(im,nm);
    if(pick)e.onclick=()=>{selLib=d.id;cards(host,1)};
    else{
      const s=document.createElement('span'),a=document.createElement('button'),x=document.createElement('button');
      a.textContent='Editar';x.textContent='🗑';
      a.onclick=()=>{cur={items:JSON.parse(JSON.stringify(d.items)),id:d.id};$('nm').value=d.name;selectItem(-1);ghostArmed=false;refreshAnim();draw()};
      x.onclick=()=>{if(!confirm('¿Eliminar "'+d.name+'"?'))return;lib=lib.filter(o=>o.id!=d.id);slots=slots.map(s=>s==d.id?null:s);persist();all()};
      s.append(a,x);e.append(s);
    }
    host.appendChild(e);
  });
}

function drawC(){
  const out=[],items=[];
  slots.forEach((id,i)=>{
    const d=lib.find(o=>o.id==id);if(!d)return;
    const ox=(i%3)*12,oy=Math.floor(i/3)*12;out.push([ox,oy]);
    d.items.forEach(o=>items.push({t:o.t,x:o.x+ox,y:o.y+oy,rot:o.rot,h:o.h,fw:o.fw,fd:o.fd,label:o.label,neon:o.neon,wall:o.wall,roof:o.roof,ledCol:o.ledCol,roofLights:o.roofLights,roofLightsCol:o.roofLightsCol,signMode:o.signMode,roadColor:o.roadColor,wallMaterial:o.wallMaterial,_t0:o._t0}));
  });
  resizeCanvas(cx2);
  setup(cx2.getContext('2d'),36,cview,cam2.zoom,cam2.panX,cam2.panY);
  render(items,{out});
  needsAnim2=items.length>0||Object.values(FX).some(v=>v);
}
function slotUI(){
  const h=$('slots');h.innerHTML='';
  slots.forEach((id,i)=>{
    const d=lib.find(o=>o.id==id),e=document.createElement('div');e.className='slot';
    if(d){
      const im=document.createElement('img');im.src=d.th;im.alt=d.name;
      const x=document.createElement('i');x.textContent='×';
      x.onclick=ev=>{ev.stopPropagation();slots[i]=null;persist();slotUI();drawC()};
      e.append(im,x);
    }else e.textContent='Casilla '+(i+1);
    e.onclick=()=>{if(selLib){slots[i]=selLib;persist();slotUI();drawC()}};
    h.appendChild(e);
  });
}

cx2.addEventListener('pointerleave',()=>{drag2=null});

  const f=e.deltaY>0?0.92:1.08;

function all(){

}
function tab(n){

$('fsBtn').onclick=()=>{
  if(!document.fullscreenElement){document.documentElement.requestFullscreen().catch(()=>{})}
  else{document.exitFullscreen()}
};

let lastT=0;
function tick(t){
  const dt=Math.min(0.1,(t-lastT)/1000)||0.016;
  lastT=t;animT=t/1000;TICK=Math.floor(animT*2.8);
  updateFX(dt);
  if(needsAnim&&!$('v1').hidden&&t-lastDrawA>33){lastDrawA=t;draw()}
  if(needsAnim2&&!$('v2').hidden&&t-lastDrawB>33){lastDrawB=t;drawC()}
  requestAnimationFrame(tick);
}

const ro=new ResizeObserver(()=>{
  if(!$('v1').hidden)draw();
  if(!$('v2').hidden)drawC();
});
ro.observe(cv);ro.observe(cx2);

refreshAnim();
all();
requestAnimationFrame(tick);
